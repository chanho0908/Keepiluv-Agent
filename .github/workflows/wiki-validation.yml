name: Wiki Validation

on:
  pull_request:
    paths:
      - "wiki/**"
      - "AGENTS.md"
      - ".agents/**"
      - ".codex/agents/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/wiki-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Validate Wiki and Agent knowledge
        run: |
          set -euo pipefail
          ./tests/wiki-automation-test.sh
          ./tests/wiki-status-test.sh
          ./tests/wiki-validator-test.sh
          ./scripts/validate-wiki.sh
          git diff --check
